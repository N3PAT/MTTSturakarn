name: Auto Composer Install

on:
  push:
    branches: [ main ] # เปลี่ยนเป็น master หากคุณใช้ชื่อนั้น

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # ปรับตามเวอร์ชัน PHP ที่โปรเจกต์คุณใช้

    - name: Install Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Commit and Push vendor folder
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f vendor/
        git diff-index --quiet HEAD || (git commit -m "auto: build vendor directory" && git push)
