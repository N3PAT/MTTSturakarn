name: Auto Composer & Deploy to Render

on:
  push:
    branches: [ main ] # ปรับให้ตรงกับชื่อ Branch หลักของคุณ

permissions:
  contents: write # จำเป็นต้องมีเพื่อให้ github-actions[bot] สามารถ push โค้ดกลับได้

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: gd

    - name: Install Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Commit and Push vendor folder
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f vendor/
        # เช็คว่ามีการเปลี่ยนแปลงหรือไม่ก่อน Commit และใส่ [skip ci]
        git diff-index --quiet HEAD || (git commit -m "auto: build vendor directory [skip ci]" && git push)

    - name: Trigger Render Deploy
      run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
