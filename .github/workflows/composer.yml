name: Auto Composer & Deploy to Render

on:
  push:
    branches: [ main ] # ปรับให้ตรงกับชื่อ Branch หลักของคุณ

permissions:
  contents: write # จำเป็นต้องมีเพื่อให้ github-actions[bot] สามารถ push โค้ดกลับได้

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: gd, mbstring, curl

    - name: Install Dependencies
      run: |
        # อนุญาตปลั๊กอิน php-http/discovery (ไม่งั้นโหมด --no-interaction จะบล็อกไว้)
        composer config --no-plugins allow-plugins.php-http/discovery true
        # เพิ่มไลบรารีส่ง Web Push + ตัวส่ง HTTP (PSR-18) ที่ไลบรารีต้องใช้ (อัปเดต composer.json/lock เท่านั้น ยังไม่ติดตั้ง)
        composer require minishlink/web-push php-http/guzzle7-adapter --no-interaction --no-progress --no-install
        composer install --no-dev --optimize-autoloader --no-interaction

    - name: Commit and Push vendor folder
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f vendor/ composer.json composer.lock
        # เช็คว่ามีการเปลี่ยนแปลงหรือไม่ก่อน Commit และใส่ [skip ci]
        git diff-index --quiet HEAD || (git commit -m "auto: build vendor directory [skip ci]" && git push)

    - name: Trigger Render Deploy
      run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
